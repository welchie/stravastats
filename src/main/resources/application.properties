spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.application.name=strava-stats
management.endpoints.web.exposure.include=health,info,snafu

# Strava API Credentials - SET THESE IN YOUR ENVIRONMENT
strava.auth_token=${STRAVA_AUTH_TOKEN:}
strava.client_id=${STRAVA_CLIENT_ID:}
strava.athlete_id=${STRAVA_ATHLETE_ID:}
strava.refresh_token=${STRAVA_REFRESH_TOKEN:}
strava.client_secret=${STRAVA_CLIENT_SECRET:}
app.datasource.url=jdbc:h2:mem:mydb
app.datasource.username=sa
app.datasource.pool-size=30

